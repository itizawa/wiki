# 管理画面（静的アセット）と API を1つの Worker で同一オリジンに出す。
# アセットは apps/admin/dist。先に `pnpm --filter @wiki/admin build` が必要。
name = "wiki-admin"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# 独自ドメインだけで出す（DNSレコードと証明書はデプロイ時に Cloudflare が作る）
routes = [{ pattern = "wiki-admin.hatchery-works.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "../admin/dist"
# 管理画面はSPAなので、ファイルに無いパスは index.html を返す
not_found_handling = "single-page-application"
# API の経路はアセットより先に Worker へ渡す（OAuth のコールバックは画面遷移なので、指定しないと index.html が返る）
# /oauth/* /.well-known/* /mcp は MCP クライアント（外部のアプリ）が呼ぶ。同意の画面（/consent）は管理画面の側
run_worker_first = ["/api/*", "/export/*", "/internal/*", "/images/*", "/health", "/oauth/*", "/.well-known/*", "/mcp"]

# DB（PostgreSQL）へは Hyperdrive 経由でつなぐ
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "24df08d8191143e5aae33847792525cc"

# アップロードした画像。本文には `/images/{name}` と書き、管理画面と公開サイト（wiki-site）の両方がこのバケットから配る
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "wiki-images"

# Cron ワーカー（wiki-worker）への「やることがある」の印（Workers KV）。API が書き、ワーカーが読む。
# 名前空間を作ってから（README「デプロイ → 初回の準備」。`npx wrangler kv namespace create wiki-cron-marks`）、
# 下の3行のコメントを外し、出力された id を入れる。apps/worker/wrangler.toml にも同じ id で同じブロックを入れる。
# id が実在しない名前空間のままコメントを外すと、wrangler deploy が失敗する。
# コメントのあいだは印を書かない（ワーカーも、バインディングが無ければ今までどおり5分おきに API を呼ぶ）。
[[kv_namespaces]]
binding = "CRON_MARKS"
id = "9e2cad4b68d14f3aa613878cc78c97be"

# ログインせずに叩ける経路（/oauth/*・/mcp）の回数の制限。接続元（cf-connecting-ip）ごとに数え、超えたら 429 を返す（src/rate-limit.ts）。
# period に書けるのは 10 か 60（秒）だけ。namespace_id はアカウントの中で重ならない数字なら何でもよい（wiki-site が 6001 を使っている）
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# アプリの登録（POST /oauth/register）：60 秒で 5 回まで
[[ratelimits]]
name = "OAUTH_REGISTER_LIMITER"
namespace_id = "6101"
simple = { limit = 5, period = 60 }

# /oauth/authorize・/oauth/token・/oauth/revoke：経路ごとに、60 秒で 30 回まで
[[ratelimits]]
name = "OAUTH_LIMITER"
namespace_id = "6102"
simple = { limit = 30, period = 60 }

# トークンの付いた /mcp：60 秒で 300 回まで。トークンを DB で確かめる前に数えるので、正しいトークンのぶんも入る。
# 許可ごとの制限（1分に120回、DB で数える）より多くして、同じ接続元から複数のアプリを使っても先にこちらに当たらないようにしている
[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "6103"
simple = { limit = 300, period = 60 }

[vars]
# 開発用ログインを無効にし、Cookie を Secure にする
NODE_ENV = "production"
# この Worker 自身のオリジン（CSRF検査と OAuth のコールバックURLに使う。末尾のスラッシュなし）
ADMIN_ORIGIN = "https://wiki-admin.hatchery-works.com"
# 公開サイト（wiki-site）のドメインの共通部分。wiki は {key}.hatchery-works.com で公開する
SITE_BASE_DOMAIN = "hatchery-works.com"

[observability]
enabled = true

# secrets（GitHub Actions のデプロイが --secrets-file で入れる。手動なら wrangler secret put）
# SESSION_SECRET        セッションCookieの署名鍵（32文字以上）
# GOOGLE_CLIENT_ID      Google OAuth クライアント
# GOOGLE_CLIENT_SECRET
# EXPORT_TOKEN          /export/public 用トークン（wiki-site のビルドの環境変数 EXPORT_TOKEN と同じ値）
# CRON_TOKEN            /internal/* 用トークン（wiki-worker の CRON_TOKEN と同じ値。EXPORT_TOKEN とは別の値にする）
# GOOGLE_SERVICE_ACCOUNT_JSON  任意。「アクセス解析」が Google Analytics とサーチコンソールの数字を読むサービスアカウントの鍵（JSON そのまま）。無ければその機能だけが「未設定」になる

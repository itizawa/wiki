# 管理画面（静的アセット）と API を1つの Worker で同一オリジンに出す。
# アセットは apps/admin/dist。先に `pnpm --filter @wiki/admin build` が必要。
name = "wiki-admin"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# 独自ドメインだけで出す（DNSレコードと証明書はデプロイ時に Cloudflare が作る）
routes = [{ pattern = "wiki-admin.hatchery-works.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "../admin/dist"
# 管理画面はSPAなので、ファイルに無いパスは index.html を返す
not_found_handling = "single-page-application"
# API の経路はアセットより先に Worker へ渡す（OAuth のコールバックは画面遷移なので、指定しないと index.html が返る）
# /oauth/* /.well-known/* /mcp は MCP クライアント（外部のアプリ）が呼ぶ。同意の画面（/consent）は管理画面の側
run_worker_first = ["/api/*", "/export/*", "/internal/*", "/images/*", "/health", "/oauth/*", "/.well-known/*", "/mcp"]

# DB（PostgreSQL）へは Hyperdrive 経由でつなぐ
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "24df08d8191143e5aae33847792525cc"

# アップロードした画像。本文には `/images/{name}` と書き、管理画面と公開サイト（wiki-site）の両方がこのバケットから配る
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "wiki-images"

[vars]
# 開発用ログインを無効にし、Cookie を Secure にする
NODE_ENV = "production"
# この Worker 自身のオリジン（CSRF検査と OAuth のコールバックURLに使う。末尾のスラッシュなし）
ADMIN_ORIGIN = "https://wiki-admin.hatchery-works.com"
# 公開サイト（wiki-site）のドメインの共通部分。wiki は {key}.hatchery-works.com で公開する
SITE_BASE_DOMAIN = "hatchery-works.com"

[observability]
enabled = true

# secrets（GitHub Actions のデプロイが --secrets-file で入れる。手動なら wrangler secret put）
# SESSION_SECRET        セッションCookieの署名鍵（32文字以上）
# GOOGLE_CLIENT_ID      Google OAuth クライアント
# GOOGLE_CLIENT_SECRET
# INTERNAL_TOKEN        /export/public と /internal/* 用トークン（ワーカー・サイトのビルドと同じ値）

# 公開サイト。ビルド結果（dist）を静的アセットとして出し、無いパスだけ worker/index.ts が受ける。
# デプロイは Cloudflare の Workers Builds（Git 連携）が行う。name はダッシュボードの Worker 名と一致させる
name = "wiki-site"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "wiki.hatchery-works.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
# /p/{id} は p/{id}.html、/u/{key}/ は u/{key}/index.html を返す
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true

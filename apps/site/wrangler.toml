# 公開サイト。1回のビルドで全 wiki のぶんを wiki ごとのディレクトリ（dist/{key}/）に出力し、
# worker/index.ts が Host のサブドメインを見て、その wiki のディレクトリから返す。
# デプロイは Cloudflare の Workers Builds（Git 連携）が行う。name はダッシュボードの Worker 名と一致させる
name = "wiki-site"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
# wiki は {key}.hatchery-works.com で公開する。カスタムドメインはワイルドカードを使えないので、ゾーンのルートで受ける。
# - DNS に、プロキシを有効にしたワイルドカードのレコード（*.hatchery-works.com）が要る（README「デプロイ」）
# - このルートは管理画面（wiki-admin）など、ほかの Worker のサブドメインにも当たる。
#   wiki の key として使えないホスト名は worker/index.ts がそのまま本来の Worker へ渡す
routes = [{ pattern = "*.hatchery-works.com/*", zone_name = "hatchery-works.com" }]
workers_dev = false
# main 以外のブランチは Workers Builds が `wrangler preview` でプレビューを作る（本番には出ない）。その確認用の URL（*.workers.dev）を出す
preview_urls = true

[assets]
directory = "dist"
binding = "ASSETS"
# アセットより先に Worker を通す。パスを直接指定して、ほかの wiki のディレクトリを開けないようにする
run_worker_first = true
# /p/{id} は {wiki}/p/{id}.html、/u/{key}/ は {wiki}/u/{key}/index.html を返す
html_handling = "auto-trailing-slash"
# 無いパスは、その wiki の 404.html（{wiki}/404.html）を返す
not_found_handling = "404-page"

# アップロードした画像（管理画面の Worker と同じバケット）。`/images/{name}` をどの wiki のサブドメインでも配る
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "wiki-images"

[vars]
# 公開サイトのドメインの共通部分。ビルドの環境変数 SITE_BASE_DOMAIN と同じ値
SITE_BASE_DOMAIN = "hatchery-works.com"
# Host で wiki が決まらないとき（プレビューの *.workers.dev、手元の `pnpm preview`）に表示する wiki。
# `?wiki={key}` を付けて開くと、その wiki に切り替わる
DEFAULT_WIKI = "wiki"
# 閲覧数（`POST /_v`）を貯める先（Workers Analytics Engine）。閲覧1回ごとに1行書くだけで、API も DB も呼ばない。
# 1時間に1回、Cron のワーカー（apps/worker/src/views.ts）がここから集計して DB に反映する。
# dataset は packages/shared の VIEW_DATASET、apps/worker/src/views.ts の VIEW_DATASET と同じ文字列にする。
# データセットは、最初に書いたときに自動でできる（先に作る手順は無い）。アカウントで Analytics Engine を有効にしておく（README「デプロイ」）
[[analytics_engine_datasets]]
binding = "PAGE_VIEWS"
dataset = "wiki_page_views"

# 閲覧数の記録用の経路（`POST /_v`）の回数の制限。接続元ごとに 60 秒で 30 回まで（超えたぶんは数えない）。
# namespace_id はアカウントの中で重ならない数字なら何でもよい
[[ratelimits]]
name = "VIEW_LIMITER"
namespace_id = "6001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true

# `wrangler preview` はこのブロックが無いと失敗する。プレビュー専用の設定は無いので空でよい
[previews]

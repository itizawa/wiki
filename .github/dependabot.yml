# 依存パッケージの更新（#53）。既知の脆弱性がある版は、Dependabot のセキュリティ更新が別にすぐ PR を出す
# （リポジトリの Settings → Code security で「Dependabot security updates」を有効にする）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # マイナー・パッチはまとめて1本の PR にする。メジャーは1つずつ
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

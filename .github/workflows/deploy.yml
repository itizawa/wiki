name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは1本ずつ。途中で打ち切らない（マイグレーションの途中で止めないため）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    # 準備（README「デプロイ」）が済むまでは動かさない。リポジトリ変数 DEPLOY_ENABLED を true にすると有効になる
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hyperdrive を通さず、DBへ直接つないでマイグレーションする
      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: require

      - name: Deploy admin + API
        working-directory: apps/api
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          pnpm --filter @wiki/admin build
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/api-secrets.json" \
            SESSION_SECRET ADMIN_EMAILS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET INTERNAL_TOKEN
          npx wrangler@4 deploy --secrets-file "$RUNNER_TEMP/api-secrets.json"

      - name: Deploy cron worker
        working-directory: apps/worker
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/worker-secrets.json" \
            INTERNAL_TOKEN SITE_DEPLOY_HOOK_URL "NOTIFY_WEBHOOK_URL?"
          npx wrangler@4 deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

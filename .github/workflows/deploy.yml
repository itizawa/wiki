name: Deploy

on:
  push:
    branches: [main]
    # 文書と、エージェント向けの設定（.claude）だけの変更では動かさない（検査もマイグレーションもデプロイも要らない）。
    # どちらも、ビルドにも実行時にも読まれない。1つでもほかのファイルが変わっていれば動く。
    # ビルドや実行時に .md や .claude の中を読むようにしたら、ここから外す
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  # 手動実行は、変わったファイルに関係なく動く（シークレットの値を変えたあとの入れ直しに使う）
  workflow_dispatch:

# デプロイは1本ずつ。途中で打ち切らない（マイグレーションの途中で止めないため）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # テストは PR で済ませているので、ここでは型チェックとビルドだけを確かめる。
  # ここでビルドした管理画面は、成果物 admin-dist として deploy のジョブへ渡る
  check:
    uses: ./.github/workflows/ci.yml
    with:
      tests: false

  deploy:
    needs: check
    # 準備（README「デプロイ」）が済むまでは動かさない。リポジトリ変数 DEPLOY_ENABLED を true にすると有効になる
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hyperdrive を通さず、DBへ直接つないでマイグレーションする
      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: require
          # ユーザーを DB で持つ移行（0007）で一度だけ読み、オーナーとして登録する。移行が本番に入ったら、この行とシークレットを消す
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      # 管理画面は check のジョブ（ci.yml）がビルドしたものを使う。ここではビルドし直さない。
      # 置き場所は apps/api/wrangler.toml の [assets] directory（../admin/dist）と合わせる
      - name: Download admin build
        uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Deploy admin + API
        working-directory: apps/api
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          # 任意。「アクセス解析」用のサービスアカウントの鍵（JSON）。未登録なら渡さず、その機能だけが「未設定」になる
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 任意。「SNS 連携」用の X の開発者アプリと、トークンを暗号化する鍵。未登録なら渡さず、その機能だけが「未設定」になる
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          SNS_TOKEN_KEY: ${{ secrets.SNS_TOKEN_KEY }}
        run: |
          test -f ../admin/dist/index.html
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/api-secrets.json" \
            SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET EXPORT_TOKEN CRON_TOKEN "GOOGLE_SERVICE_ACCOUNT_JSON?" \
            "X_CLIENT_ID?" "X_CLIENT_SECRET?" "SNS_TOKEN_KEY?"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/api-secrets.json"

      - name: Deploy cron worker
        working-directory: apps/worker
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/worker-secrets.json" \
            CRON_TOKEN SITE_DEPLOY_HOOK_URL "NOTIFY_WEBHOOK_URL?"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

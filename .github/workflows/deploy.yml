name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは1本ずつ。途中で打ち切らない（マイグレーションの途中で止めないため）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # テストは PR で済ませているので、ここでは型チェックとビルドだけを確かめる
  check:
    uses: ./.github/workflows/ci.yml
    with:
      tests: false

  deploy:
    needs: check
    # 準備（README「デプロイ」）が済むまでは動かさない。リポジトリ変数 DEPLOY_ENABLED を true にすると有効になる
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hyperdrive を通さず、DBへ直接つないでマイグレーションする
      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: require
          # ユーザーを DB で持つ移行（0007）で一度だけ読み、オーナーとして登録する。移行が本番に入ったら、この行とシークレットを消す
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

      - name: Deploy admin + API
        working-directory: apps/api
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          # 任意。「アクセス解析」用のサービスアカウントの鍵（JSON）。未登録なら渡さず、その機能だけが「未設定」になる
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 任意。「SNS 連携」用の X の開発者アプリと、トークンを暗号化する鍵。未登録なら渡さず、その機能だけが「未設定」になる
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          SNS_TOKEN_KEY: ${{ secrets.SNS_TOKEN_KEY }}
        run: |
          pnpm --filter @wiki/admin build
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/api-secrets.json" \
            SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET INTERNAL_TOKEN "GOOGLE_SERVICE_ACCOUNT_JSON?" \
            "X_CLIENT_ID?" "X_CLIENT_SECRET?" "SNS_TOKEN_KEY?"
          npx wrangler@4 deploy --secrets-file "$RUNNER_TEMP/api-secrets.json"

      - name: Deploy cron worker
        working-directory: apps/worker
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          node ../../scripts/write-secrets.mjs "$RUNNER_TEMP/worker-secrets.json" \
            INTERNAL_TOKEN SITE_DEPLOY_HOOK_URL "NOTIFY_WEBHOOK_URL?"
          npx wrangler@4 deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

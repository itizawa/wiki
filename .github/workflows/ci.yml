name: CI

on:
  pull_request:
  # main への push では deploy.yml がこれを呼んでからデプロイする
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @wiki/admin build
      # サンプルのマニフェストで公開サイトをビルドし、限定公開の漏れ等を検査する
      - run: pnpm --filter @wiki/site build:sample
